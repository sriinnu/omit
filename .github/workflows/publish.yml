name: Stage on npm

on:
  push:
    tags:
      - "v*.*.*"

# No npm token anywhere. npm's trusted publishing has this workflow prove who
# it is with a short-lived OIDC token GitHub mints for the run (that is what
# id-token: write allows), and npm checks it against the publisher configured
# for the package: sriinnu/omit, publish.yml. A stored token expired twice and
# stopped two releases after their tags were already pushed.
#
# The workflow only STAGES the version. It goes live when a maintainer runs
# `npm stage approve <id>` with 2FA. Trust is stage-only:
# npm trust github @sriinnu/omit --repo sriinnu/omit --file publish.yml --allow-stage-publish
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # npm stage needs npm 11.15 or later. An older npm does not always fail
      # by saying so (for trusted publishing it sends no credentials and the
      # registry answers 404), so pin a known version.
      - name: npm with stage support
        run: npm install -g --ignore-scripts npm@11.20.0 && npm --version

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          PKG_NAME="$(node -p "require('./package.json').name")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "PKG_NAME=$PKG_NAME" >> "$GITHUB_ENV"
          echo "PKG_VERSION=$PKG_VERSION" >> "$GITHUB_ENV"

      - name: Skip if already published
        id: check
        run: |
          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "Already on the registry, nothing to do."
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage
        if: steps.check.outputs.already_published == 'false'
        run: |
          npm stage publish --access public --provenance
          echo "::notice::$PKG_NAME@$PKG_VERSION is staged. Approve: npm stage list $PKG_NAME, then npm stage approve <id>."
