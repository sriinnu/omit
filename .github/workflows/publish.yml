name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"

# No npm token anywhere. npm's trusted publishing has this workflow prove who
# it is with a short-lived OIDC token GitHub mints for the run (that is what
# id-token: write allows), and npm checks it against the publisher configured
# for the package: sriinnu/omit, publish.yml. A stored token expired twice and
# stopped two releases after their tags were already pushed.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm 11.5.1 or later. An older npm does not
      # fail by saying so: it sends no credentials and the registry answers
      # 404, which reads as a missing package. Say it here instead.
      - name: npm is new enough for trusted publishing
        run: |
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number)
            const older = major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))
            if (older) { console.error(`npm ${process.argv[1]} cannot do trusted publishing: it needs 11.5.1 or later`); process.exit(1) }
            console.log(`npm ${process.argv[1]}`)
          ' "$(npm --version)"

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          PKG_NAME="$(node -p "require('./package.json').name")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "PKG_NAME=$PKG_NAME" >> "$GITHUB_ENV"
          echo "PKG_VERSION=$PKG_VERSION" >> "$GITHUB_ENV"

      - name: Skip if already published
        id: check
        run: |
          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "Already on the registry, nothing to do."
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.check.outputs.already_published == 'false'
        run: |
          # The provenance attestation comes with trusted publishing; no flag.
          if npm publish --access public; then
            echo "Publish succeeded."
            exit 0
          fi

          # npm's registry can 404 a fresh scoped package's first publish for a
          # few seconds after the write actually lands (read-replica lag), which
          # makes npm publish report failure even though the version is live.
          # Poll before trusting the error.
          echo "npm publish reported failure; checking whether it landed anyway..."
          for i in $(seq 1 10); do
            sleep 6
            if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
              echo "Version $PKG_VERSION is live on the registry — treating as success."
              exit 0
            fi
          done

          echo "Version never appeared on the registry after retries. Publish failed."
          exit 1
