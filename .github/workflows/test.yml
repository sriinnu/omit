name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm test

      # action.yml is read by GitHub's action loader, not by anything in this
      # repo, so an invalid one fails silently: the Action simply never runs and
      # no check here notices. It shipped invalid once already — an unquoted
      # ": " inside the description — which no test, and no reviewer, caught.
      - name: action.yml parses
        run: |
          python3 - <<'PY'
          import sys
          try:
              import yaml
          except ImportError:
              # Announced rather than silent: on a runner without PyYAML this
              # guard is advisory, and saying so beats implying it ran.
              print("PyYAML unavailable on this runner — action.yml was NOT validated")
              sys.exit(0)
          doc = yaml.safe_load(open("action.yml"))
          for key in ("name", "description", "runs"):
              assert key in doc, f"action.yml is missing a required key: {key}"
          assert doc["runs"].get("using") == "composite", "runs.using must be composite"
          print("action.yml parses and carries its required keys")
          PY

      # Same failure mode as action.yml: Claude Code tolerates an unquoted ": "
      # in a description, but strict YAML loaders (the skills CLI, skill
      # indexers) reject the whole file, and the skill silently disappears.
      - name: skill and rule frontmatter parses
        run: |
          python3 - <<'PY'
          import sys
          try:
              import yaml
          except ImportError:
              print("PyYAML unavailable on this runner — frontmatter was NOT validated")
              sys.exit(0)
          for path in ("skills/omit/SKILL.md", ".cursor/rules/omit.mdc"):
              meta = yaml.safe_load(open(path).read().split("---")[1])
              assert meta.get("description"), f"{path}: frontmatter has no description"
              print(f"{path}: frontmatter parses")
          PY
