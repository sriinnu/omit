name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # macOS runs the suite too: the keychain leak rules are macOS-specific, and
    # a Linux-only CI never exercises the platform they name. The suite is
    # POSIX-shaped (/dev/null, sh stubs), so Windows waits for a port of the
    # fixtures; the Windows spawn path is unit-tested by platform injection.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm test

      # action.yml is read by GitHub's action loader, not by anything in this
      # repo, so an invalid one fails silently: the Action simply never runs and
      # no check here notices. It shipped invalid once already — an unquoted
      # ": " inside the description — which no test, and no reviewer, caught.
      - name: action.yml parses
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 - <<'PY'
          import sys
          try:
              import yaml
          except ImportError:
              # Announced rather than silent: on a runner without PyYAML this
              # guard is advisory, and saying so beats implying it ran.
              print("PyYAML unavailable on this runner — action.yml was NOT validated")
              sys.exit(0)
          doc = yaml.safe_load(open("action.yml"))
          for key in ("name", "description", "runs"):
              assert key in doc, f"action.yml is missing a required key: {key}"
          assert doc["runs"].get("using") == "composite", "runs.using must be composite"
          print("action.yml parses and carries its required keys")
          PY

      # Same failure mode as action.yml: Claude Code tolerates an unquoted ": "
      # in a description, but strict YAML loaders (the skills CLI, skill
      # indexers) reject the whole file, and the skill silently disappears.
      - name: skill and rule frontmatter parses
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 - <<'PY'
          import sys
          try:
              import yaml
          except ImportError:
              print("PyYAML unavailable on this runner — frontmatter was NOT validated")
              sys.exit(0)
          for path in ("skills/omit/SKILL.md", "skills/omit-codemode/SKILL.md", ".cursor/rules/omit.mdc"):
              meta = yaml.safe_load(open(path).read().split("---")[1])
              assert meta.get("description"), f"{path}: frontmatter has no description"
              print(f"{path}: frontmatter parses")
          PY

  # The sandbox is an optional peer, so `npm test` above never installs it and
  # the end-to-end case there is announced as skipped. This job is where a real
  # script runs in the real sandbox, at the version the lockfile pins.
  codemode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      - run: node --test test/codemode.test.mjs
        env:
          OMIT_CODEMODE_REQUIRED: "1"

  # load-bearing: main's ruleset requires a check named `test`. The matrix above
  # reports `test (ubuntu-latest)` and `test (macos-latest)`, so without this
  # job the required check never arrives and every PR stays blocked.
  required:
    name: test
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = success
