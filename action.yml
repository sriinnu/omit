name: omit audit
description: Comment the omit verdict (net diff, new deps, hazards, lint) on pull requests, and optionally gate every commit in them. Works whatever agent or editor wrote the code.
branding:
  icon: scissors
  color: gray-dark
inputs:
  base:
    description: Base ref to diff against
    required: false
    default: ''
  exec:
    description: >
      Execute the `run` snippets in .omit/receipts.jsonl to fully verify them.
      Off by default: a PR's receipts are untrusted code, and this action runs on
      pull requests. Turn it on for repos whose PRs you already run code from.
      Also gates the repo's own linter, which a PR's config file can make
      arbitrary: with exec off, the verdict reports the linter as not run.
    required: false
    default: 'false'
  fail-on:
    description: >
      Fail the check when the verdict carries hazards: "secret" fails on
      hardcoded secrets, "hazard" on any hazard (secrets, injection, TLS).
      Default "none": the verdict is a comment, and the check stays green.
    required: false
    default: 'none'
  gate:
    description: >
      Also gate every commit in the PR with `omit gate --range`, and fail the
      check on a block. Adoption and mode are read from the PR's base, so a PR
      cannot loosen its own gate. Runs omit from this action's own checkout, never
      the PR's code, with execution off (OMIT_NO_EXEC=1): receipts and the linter
      are reported as not run. Needs the full history (checkout with fetch-depth 0)
      and a pull_request event: pull_request_target would hand a fork's PR a
      write token and secrets, and the whole point is that the PR's code gets neither.
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Run omit audit
      id: audit
      # The verdict is commented even when fail-on refuses it; the last step
      # turns the refusal into a failed check.
      continue-on-error: true
      shell: bash
      env:
        # Inverted on purpose. The obvious `exec == 'true' && '' || '1'` never
        # enables anything: '' is falsy in an expression, so the `&&` yields
        # false and the `||` always takes '1'. Here the value being truth-tested
        # is '1', which is never ambiguous, and the enabled branch yields '0' —
        # an explicit off-value for OMIT_NO_EXEC, so the input can never mean
        # "maybe". Anything that isn't exactly 'true' stays disabled.
        OMIT_NO_EXEC: ${{ inputs.exec != 'true' && '1' || '0' }}
        # load-bearing: inputs reach the script through the environment, never
        # spliced into it: `${{ }}` inside run becomes shell text before the shell parses,
        # so a chosen base ref could carry a command of its own.
        OMIT_BASE: ${{ inputs.base }}
        OMIT_FAIL_ON: ${{ inputs.fail-on }}
        PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
      run: |
        BASE="$OMIT_BASE"
        if [ -z "$BASE" ]; then BASE="origin/$PR_BASE_REF"; fi
        git fetch --depth=1 origin "$PR_BASE_REF" || true
        # Outside the workspace: the redirect creates the file before the audit
        # runs, and the audit counts untracked files — a verdict written into
        # the checkout reports itself as one more changed file.
        node "${{ github.action_path }}/bin/omit.mjs" audit --base "$BASE" --markdown --fail-on "$OMIT_FAIL_ON" > "$RUNNER_TEMP/omit-verdict.md"
        cat "$RUNNER_TEMP/omit-verdict.md"
    - name: Comment on PR
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        # An audit that produced nothing has nothing to comment; an empty
        # verdict would read as a clean one.
        if [ ! -s "$RUNNER_TEMP/omit-verdict.md" ]; then
          echo "omit: the audit produced no verdict — nothing to comment."
          exit 1
        fi
        # One comment per PR, edited in place: a marker finds omit's previous
        # verdict, so a push updates it instead of stacking another.
        MARKER='<!-- omit verdict -->'
        { printf '%s\n' "$MARKER"; cat "$RUNNER_TEMP/omit-verdict.md"; } > "$RUNNER_TEMP/omit-comment.md"
        # load-bearing: only the bot's own comment counts. A marker anyone can plant
        # would make this step PATCH a stranger's comment. The first match is taken
        # in bash: `head` would close the pipe early and SIGPIPE gh under pipefail.
        IDS=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$MARKER\"))) | .id")
        COMMENT_ID=${IDS%%$'\n'*}
        if [ -n "$COMMENT_ID" ]; then
          gh api --method PATCH "repos/$REPO/issues/comments/$COMMENT_ID" -F body=@"$RUNNER_TEMP/omit-comment.md"
        else
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file "$RUNNER_TEMP/omit-comment.md"
        fi
    - name: Run omit gate
      id: gate
      if: inputs.gate == 'true'
      continue-on-error: true
      shell: bash
      env:
        # load-bearing: never `exec`: the checked-out tree is the PR's, and its
        # receipts and lint config are its author's code.
        OMIT_NO_EXEC: '1'
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        # A pull_request checkout is a merge of the PR into the base branch as it
        # is NOW; its first parent is the base the PR is judged against. A plain
        # head checkout falls back to the event's base sha.
        BASE="$BASE_SHA"
        if git rev-parse --verify --quiet 'HEAD^2' > /dev/null; then BASE=$(git rev-parse 'HEAD^1'); fi
        if [ -z "$BASE" ]; then
          echo "omit gate: no pull_request base to judge against — run this on pull_request."
          exit 1
        fi
        if ! node "$ACTION_PATH/bin/omit.mjs" gate --range "$BASE..HEAD" --json > "$RUNNER_TEMP/omit-gate.json"; then
          cat "$RUNNER_TEMP/omit-gate.json"
          exit 1
        fi
        cat "$RUNNER_TEMP/omit-gate.json"
    - name: Enforce gate
      if: steps.gate.outcome == 'failure'
      shell: bash
      run: |
        echo "omit: the gate blocked this PR, or could not read its history — see the step above."
        exit 1
    - name: Enforce fail-on
      if: steps.audit.outcome == 'failure'
      shell: bash
      run: |
        echo "omit: the audit could not complete, or the verdict carries hazards with fail-on set — see the PR comment."
        exit 1
